name: Rebuild bundled Thonny ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild-zip:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch build.bat inside Thonny ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'thonny-5.0.1.zip'
          if (-not (Test-Path $zip)) {
            throw "thonny-5.0.1.zip was not found."
          }

          $work = Join-Path $env:RUNNER_TEMP 'thonny-rebuild'
          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }
          New-Item -ItemType Directory -Path $work | Out-Null

          Expand-Archive -Path $zip -DestinationPath $work -Force

          $buildBat = Join-Path $work 'thonny-5.0.1\build.bat'
          if (-not (Test-Path $buildBat)) {
            throw "Expected build.bat was not found inside the archive."
          }

          @'
          @echo off
          setlocal
          cd /d "%~dp0"

          echo ========================================
          echo Thonny source development setup
          echo ========================================
          echo.

          where py >nul 2>&1
          if errorlevel 1 (
              echo ERROR: Python Launcher ^(py.exe^) was not found.
              echo Install Python 3.10 or newer and try again.
              exit /b 1
          )

          if not exist "venv\Scripts\python.exe" (
              echo Creating virtual environment...
              py -3 -m venv venv
              if errorlevel 1 (
                  echo ERROR: Could not create the virtual environment.
                  exit /b 1
              )
          )

          set "PY=venv\Scripts\python.exe"

          echo Updating build tools...
          "%PY%" -m pip install --upgrade pip setuptools wheel
          if errorlevel 1 exit /b 1

          echo Installing formatting tools...
          "%PY%" -m pip install isort black
          if errorlevel 1 exit /b 1

          echo Running isort...
          "%PY%" -m isort thonny
          if errorlevel 1 exit /b 1

          echo Running black...
          "%PY%" -m black thonny
          if errorlevel 1 exit /b 1

          echo.
          echo ========================================
          echo Source check completed successfully.
          echo ========================================
          echo.
          echo NOTE: This script prepares/checks the source code.
          echo It does not create the Windows installer.
          echo For the Windows installer, run:
          echo packaging\windows\create_installer.bat

          endlocal
          '@ | Set-Content -Path $buildBat -Encoding ascii

          Remove-Item $zip -Force
          Compress-Archive -Path (Join-Path $work 'thonny-5.0.1') -DestinationPath $zip -CompressionLevel Optimal

      - name: Commit replacement ZIP
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thonny-5.0.1.zip
          if (git diff --cached --quiet) {
            Write-Host "ZIP is already up to date."
            exit 0
          }
          git commit -m "Fix Thonny build bootstrap [skip ci]"
          git push
